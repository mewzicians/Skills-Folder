name: Verify skill suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a newer push to the same pull request supersedes a run. Pushes to
  # main and the weekly run must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.15"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Structure, frontmatter, text policy, budgets, and the neutrality lint.
      - name: Verify package
        run: python -B -X warn_default_encoding -W error::EncodingWarning tools/verify_package.py --budgets

      - name: Validate portable frontmatter
        run: >-
          python -B -X warn_default_encoding -W error::EncodingWarning
          tools/validate_skill.py --level portable skills/*/

      - name: Run the strict static auditor on every skill
        run: |
          status=0
          for skill in skills/*/; do
            if ! output=$(python -B -X warn_default_encoding -W error::EncodingWarning \
                skills/game-skill-auditor/scripts/audit_skill.py "$skill" --json --strict); then
              echo "$output"
              echo "::error::Strict audit failed: $skill"
              status=1
            fi
          done
          exit "$status"

      - name: Run tool tests
        run: |
          python -B -X warn_default_encoding -W error::EncodingWarning tests/frontmatter/test_frontmatter.py
          python -B -X warn_default_encoding -W error::EncodingWarning tests/verify/test_verify_package.py
          python -B -X warn_default_encoding -W error::EncodingWarning tests/scripts/test_skill_scripts.py
          python -B -X warn_default_encoding -W error::EncodingWarning tests/zip/test_build_repository_zip.py

      # Every test points HOME, USERPROFILE, CODEX_HOME, CLAUDE_CONFIG_DIR,
      # LOCALAPPDATA, and XDG_STATE_HOME into a temporary folder, and the run
      # fails if the runner's real skill or state folders change.
      - name: Run the installer tests in temporary homes
        run: >-
          python -B -X warn_default_encoding -W error::EncodingWarning
          tests/install/test_install.py

      - name: Run the continuity self-test
        run: >-
          python -B -X warn_default_encoding -W error::EncodingWarning
          skills/game-context-continuity/scripts/continuity_ledger.py self-test

      # Before PyYAML is installed, so the default run is shown to need none.
      - name: Run the auditor adversarial self-test
        run: >-
          python -B -X warn_default_encoding -W error::EncodingWarning
          skills/game-skill-auditor/scripts/self_test.py

      - name: Install the CI-only test dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Compare the frontmatter schema with PyYAML
        env:
          SKILL_SUITE_REQUIRE_PYYAML: "1"
        run: >-
          python -B -X warn_default_encoding -W error::EncodingWarning
          tests/frontmatter/test_differential.py
