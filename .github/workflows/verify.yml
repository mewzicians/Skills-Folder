name: Verify skill suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependency
        run: python -m pip install pyyaml

      - name: Verify package and manifest
        shell: pwsh
        run: ./verify-package.ps1

      - name: Run official validator on every skill
        shell: pwsh
        run: |
          $validator = "skills/game-skill-creator/scripts/quick_validate.py"
          Get-ChildItem "skills" -Directory | Sort-Object Name | ForEach-Object {
            python -B $validator $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Official validation failed: $($_.Name)"
            }
          }

      - name: Run strict static auditor
        shell: pwsh
        run: |
          $auditor = "skills/game-skill-auditor/scripts/audit_skill.py"
          Get-ChildItem "skills" -Directory | Sort-Object Name | ForEach-Object {
            python -B $auditor $_.FullName --json --strict
            if ($LASTEXITCODE -ne 0) {
              throw "Strict audit failed: $($_.Name)"
            }
          }

      - name: Run continuity self-test
        run: >-
          python -B
          skills/game-context-continuity/scripts/continuity_ledger.py
          self-test

      - name: Run auditor adversarial self-test
        run: python -B skills/game-skill-auditor/scripts/self_test.py
