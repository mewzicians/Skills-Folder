  <rect width="1280" height="360" rx="28" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#7dd3fc" stroke-opacity="0.22" stroke-width="2"/>

  <ellipse cx="230" cy="200" rx="170" ry="110" fill="#38bdf8" fill-opacity="0.12" filter="url(#haze)"/>
  <ellipse cx="640" cy="200" rx="230" ry="130" fill="#f59e0b" fill-opacity="0.12" filter="url(#haze)"/>
  <ellipse cx="1080" cy="180" rx="170" ry="120" fill="#a78bfa" fill-opacity="0.12" filter="url(#haze)"/>

